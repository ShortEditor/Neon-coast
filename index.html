<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NEON COAST — After the Flood</title>
<script type="importmap">
{
"imports": {
"three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
"three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
}
}
</script>
<style>
:root {
--mint:#b5e8d3;
--pink:#e7a3bd;
--ink:#0c1722;
--muted:#a2b7c0;
}
*{box-sizing:border-box}
body{
margin:0;overflow:hidden;background:#09121d;color:#eef2eb;
font:14px system-ui,sans-serif
}
#game{position:fixed;inset:0;width:100%;height:100%}
button,input,select{font:inherit}
button{
padding:12px 18px;border:1px solid #607d83;border-radius:3px;
background:#19303c;color:#eef5ee;cursor:pointer;
transition:background .15s,border-color .15s
}
button:hover{background:#304b53;border-color:var(--mint)}
button:disabled{opacity:.35;cursor:default}
h1{
font-size:clamp(42px,7vw,82px);font-style:italic;letter-spacing:.08em;
line-height:.95;margin:12px 0 22px;color:#f0c2ce;
text-shadow:3px 4px #32596b
}
h2{font-size:20px;font-weight:500;letter-spacing:.12em}
p{line-height:1.7}
small,.muted{color:var(--muted)}
#hud{position:fixed;inset:0;pointer-events:none;display:none}
#brand{
position:absolute;top:25px;left:28px;font-size:13px;
font-weight:700;letter-spacing:.22em;color:var(--mint)
}
#objective{
position:absolute;left:28px;top:62px;max-width:440px;
padding:12px 16px;line-height:1.55;border-left:2px solid var(--pink);
background:linear-gradient(90deg,#091621e8,#09162155)
}
#heat{
position:absolute;right:28px;top:22px;font-size:24px;
color:var(--pink);letter-spacing:7px
}
#clock{
position:absolute;right:28px;top:62px;text-align:right;
color:#c7d6dc;font-size:12px;line-height:1.8
}
#mini{
position:absolute;left:25px;bottom:24px;width:164px;height:164px;
border:1px solid #6a848b;border-radius:50%;background:#0b1a26dd
}
#stats{
position:absolute;left:210px;bottom:26px;font-size:11px;
text-shadow:0 2px 5px #000
}
.bar{height:5px;width:145px;margin:6px 0 12px;background:#324650}
.fill{height:100%;background:var(--mint)}
#health{background:var(--pink)}
#speed{
position:absolute;right:28px;bottom:28px;font-size:42px;font-weight:200
}
#speed small{font-size:11px;letter-spacing:.12em}
#radio{
position:absolute;right:28px;bottom:103px;text-align:right;
font-size:11px;color:#e5c4c9;line-height:1.8;letter-spacing:.1em
}
#reticle{
position:absolute;left:50%;top:50%;width:3px;height:3px;
background:#ecfff4a0;border-radius:50%
}
#prompt{
position:absolute;left:50%;bottom:22%;transform:translateX(-50%);
padding:10px 16px;background:#0a1722df;border:1px solid #63818a;
max-width:650px;text-align:center;display:none
}
#marker{
position:absolute;transform:translate(-50%,-100%);text-align:center;
color:#e6dcaf;font-size:11px;text-shadow:0 2px 5px #000
}
#marker b{display:block;font-size:25px;color:var(--mint)}
#toast{
position:absolute;top:16%;left:50%;transform:translateX(-50%);
max-width:660px;width:max-content;max-width:min(660px,90vw);
padding:13px 21px;background:#0b1927ed;border-bottom:2px solid var(--mint);
text-align:center;line-height:1.6;display:none
}
#damage{position:absolute;inset:0;box-shadow:inset 0 0 100px #e42b57;opacity:0}
#chapter{
position:absolute;left:8%;top:35%;opacity:0;transition:opacity .8s;
max-width:75%;text-shadow:0 3px 20px #000
}
#chapter strong{
display:block;font-size:clamp(28px,4.5vw,60px);font-weight:300;
letter-spacing:.16em;margin:10px 0
}
#chapter small{color:var(--pink);letter-spacing:.25em}
#chapter span{font:italic 17px Georgia,serif;color:#d4dbd6}
.cinema-bar{
position:absolute;left:0;right:0;height:0;background:#03070b;
transition:height .8s
}
#topbar{top:0}
#bottombar{bottom:0}
#overlay{
position:fixed;inset:0;z-index:5;display:flex;align-items:center;
justify-content:center;background:linear-gradient(100deg,#07121ce8,#18152499)
}
.panel{
width:min(800px,calc(100% - 32px));max-height:94vh;overflow:auto;
padding:30px;background:#101b27f2;border:1px solid #3c5865;
box-shadow:0 20px 100px #0009
}
.kicker{font-size:10px;letter-spacing:.28em;color:var(--pink)}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}
.setting{
display:flex;align-items:center;justify-content:space-between;
gap:25px;margin:19px 0
}
#map{width:100%;max-height:48vh;object-fit:contain;display:none;background:#0c1a27}
#loading{
position:fixed;inset:0;z-index:10;background:#09131f;
display:flex;align-items:center;justify-content:center;
padding:30px;line-height:1.8;letter-spacing:.15em
}
@media(max-height:700px){
.panel{padding:22px}
h1{font-size:42px;margin:10px 0}
}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud">
<div id="brand">NEON COAST / AFTER THE FLOOD</div>
<div id="objective"></div>
<div id="heat"></div>
<div id="clock"></div>
<canvas id="mini" width="328" height="328"></canvas>
<div id="stats">
HEALTH
<div class="bar"><div id="health" class="fill"></div></div>
STAMINA
<div class="bar"><div id="stamina" class="fill"></div></div>
<span id="cash"></span>
</div>
<div id="speed"></div>
<div id="radio"></div>
<div id="reticle"></div>
<div id="prompt"></div>
<div id="marker"></div>
<div id="toast"></div>
<div id="damage"></div>
<div id="topbar" class="cinema-bar"></div>
<div id="bottombar" class="cinema-bar"></div>
<div id="chapter">
<small>NEON COAST / AFTER THE FLOOD</small>
<strong></strong>
<span></span>
</div>
</div>
<div id="overlay">
<section class="panel">
<div class="kicker">AN ORIGINAL FIRST-PERSON COASTAL NOIR</div>
<h1>NEON COAST</h1>
<h2 id="menuTitle"></h2>
<div id="menuBody"></div>
<canvas id="map" width="760" height="560"></canvas>
<div id="buttons" class="row"></div>
<p id="menuFoot" class="muted"></p>
</section>
</div>
<div id="loading">BUILDING THE COAST…</div>
<script type="module" src="./main.js"></script>
</body>
</html>
